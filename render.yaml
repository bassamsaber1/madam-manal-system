services:
  - type: web
    name: data-egypt
    runtime: node
    plan: free
    buildCommand: git lfs pull && npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      - key: GITHUB_REPO
        value: bassamsaber1/madam-manal-system
      - key: GITHUB_TOKEN
        sync: false
